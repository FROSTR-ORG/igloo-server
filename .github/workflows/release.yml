name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.0, patch, minor, major)'
        required: true
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      new_version: ${{ steps.new_version.outputs.new_version }}
      version_number: ${{ steps.new_version.outputs.version_number }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.10

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          # Auto-determine version based on commit messages since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            LOG_CMD="git log --format=%s $LAST_TAG..HEAD"
          else
            # No tags yet: inspect the last 50 commits (avoids HEAD~N issues on shallow/short histories)
            LOG_CMD="git log --format=%s -n 50"
          fi

          if eval "$LOG_CMD" | grep -Eq 'BREAKING CHANGE|^feat\([^)]+\)?!'; then
            VERSION="major"
          elif eval "$LOG_CMD" | grep -Eq '^feat\([^)]+\)?:'; then
            VERSION="minor"
          else
            VERSION="patch"
          fi
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Update version
      id: new_version
      run: |
        NEW_VERSION=$(npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version)
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${NEW_VERSION#v}" >> $GITHUB_OUTPUT

    - name: Type check
      run: bun run tsc --noEmit

    - name: Run test suite
      run: bun test

    - name: Build application
      run: bun run build

    - name: Update changelog
      run: |
        # Create or update CHANGELOG.md
        if [ ! -f CHANGELOG.md ]; then
          echo "# CHANGELOG" > CHANGELOG.md
          echo "" >> CHANGELOG.md
        fi

        VERSION="${{ steps.new_version.outputs.version_number }}"
        DATE=$(date +%Y-%m-%d)
        if ! grep -Fq "## [${VERSION}]" CHANGELOG.md; then
          awk -v version="$VERSION" -v date="$DATE" '
            NR == 1 { print; print ""; print "## [" version "] - " date; print ""; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
        fi

        temp_changelog="$(mktemp)"

        # Add commit messages since last tag (safe for special chars in subjects)
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          printf '### Changes since %s:\n' "$LAST_TAG" > "$temp_changelog"
          git log --pretty=format:'%s%x00' "$LAST_TAG..HEAD" \
            | tr '\0' '\n' \
            | awk 'NF { print "- " $0 }' >> "$temp_changelog"
        else
          printf '### Changes:\n' > "$temp_changelog"
          git log --pretty=format:'%s%x00' -n 10 \
            | tr '\0' '\n' \
            | awk 'NF { print "- " $0 }' >> "$temp_changelog"
        fi
        printf '\n' >> "$temp_changelog"

        # Insert changes into changelog after the current version heading
        awk -v target="## [${VERSION}]" -v insert_file="$temp_changelog" '
          { print }
          $0 == target && !inserted {
            while ((getline line < insert_file) > 0) print line
            close(insert_file)
            inserted = 1
          }
        ' CHANGELOG.md > CHANGELOG.md.tmp
        mv CHANGELOG.md.tmp CHANGELOG.md
        rm -f "$temp_changelog"

    - name: Commit release metadata
      run: |
        TAG="${{ steps.new_version.outputs.new_version }}"
        git add package.json bun.lock CHANGELOG.md
        if git diff --cached --quiet; then
          echo "No release metadata changes to commit"
        else
          git commit -m "chore(release): ${TAG}"
          git push origin HEAD:${GITHUB_REF_NAME}
        fi

    - name: Create release archive
      run: |
        mkdir -p release
        
        # Create source archive
        tar -czf release/igloo-server-${{ steps.new_version.outputs.version_number }}-src.tar.gz \
          --exclude=node_modules \
          --exclude=.git \
          --exclude=release \
          --exclude=static/app.js \
          --exclude=static/styles.css \
          .
        
        # Create binary archive with built assets
        tar -czf release/igloo-server-${{ steps.new_version.outputs.version_number }}.tar.gz \
          --exclude=node_modules \
          --exclude=.git \
          --exclude=release \
          --exclude=frontend \
          src static package.json bun.lock tsconfig.json Dockerfile compose.yml README.md LICENSE

    - name: Create release tag
      run: |
        TAG="${{ steps.new_version.outputs.new_version }}"
        git fetch --tags origin
        if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
          echo "Tag ${TAG} already exists, skipping tag creation"
        else
          git tag "${TAG}"
          git push origin "${TAG}"
        fi

    - name: Create GitHub release and upload assets
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.new_version.outputs.new_version }}
        name: Release ${{ steps.new_version.outputs.new_version }}
        body: |
          ## Changes in ${{ steps.new_version.outputs.new_version }}
          
          See [CHANGELOG.md](https://github.com/FROSTR-ORG/igloo-server/blob/main/CHANGELOG.md) for full details.
          
          ### Installation
          
          **Docker (Recommended)**:
          ```bash
          docker pull ghcr.io/frostr-org/igloo-server:${{ steps.new_version.outputs.version_number }}
          ```
          
          **From Source**:
          ```bash
          curl -L https://github.com/FROSTR-ORG/igloo-server/archive/${{ steps.new_version.outputs.new_version }}.tar.gz | tar -xz
          cd igloo-server-${{ steps.new_version.outputs.version_number }}
          bun install
          bun run build
          bun run start
          ```
        draft: false
        prerelease: false
        files: |
          ./release/igloo-server-${{ steps.new_version.outputs.version_number }}-src.tar.gz
          ./release/igloo-server-${{ steps.new_version.outputs.version_number }}.tar.gz

  docker:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ needs.release.outputs.new_version }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/frostr-org/igloo-server:latest
          ghcr.io/frostr-org/igloo-server:${{ needs.release.outputs.version_number }}
        labels: |
          org.opencontainers.image.title=Igloo Server
          org.opencontainers.image.description=A server-based signing device for the FROSTR protocol
          org.opencontainers.image.source=https://github.com/FROSTR-ORG/igloo-server
          org.opencontainers.image.version=${{ needs.release.outputs.version_number }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max 

    - name: Build and push Umbrel Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: packages/umbrel/igloo/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/frostr-org/igloo-server:umbrel-latest
          ghcr.io/frostr-org/igloo-server:umbrel-${{ needs.release.outputs.version_number }}
        labels: |
          org.opencontainers.image.title=Igloo Server (Umbrel)
          org.opencontainers.image.description=Igloo Server packaged for Umbrel app deployments
          org.opencontainers.image.source=https://github.com/FROSTR-ORG/igloo-server
          org.opencontainers.image.version=${{ needs.release.outputs.version_number }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
