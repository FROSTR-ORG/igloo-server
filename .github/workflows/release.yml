name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      version_number: ${{ steps.version.outputs.version_number }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.10

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Resolve version
      id: version
      run: |
        VERSION=$(node -p "require('./package.json').version")
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
          echo "Invalid package.json version: $VERSION"
          exit 1
        fi
        echo "new_version=v$VERSION" >> "$GITHUB_OUTPUT"
        echo "version_number=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Verify release metadata
      run: |
        bun run version:check
        bun run docs:validate
        VERSION="${{ steps.version.outputs.version_number }}"
        grep -F "## [${VERSION}]" CHANGELOG.md >/dev/null

    - name: Type check
      run: bun run tsc --noEmit

    - name: Run test suite
      run: bun test

    - name: Build application
      run: bun run build

    - name: Create release archive
      run: |
        mkdir -p release

        tar -czf release/igloo-server-${{ steps.version.outputs.version_number }}-src.tar.gz \
          --exclude=node_modules \
          --exclude=.git \
          --exclude=release \
          --exclude=static/app.js \
          --exclude=static/styles.css \
          .

        tar -czf release/igloo-server-${{ steps.version.outputs.version_number }}.tar.gz \
          --exclude=node_modules \
          --exclude=.git \
          --exclude=release \
          --exclude=frontend \
          src static package.json bun.lock tsconfig.json Dockerfile compose.yml README.md LICENSE docs/openapi

    - name: Create release tag
      run: |
        TAG="${{ steps.version.outputs.new_version }}"
        git fetch --tags origin
        if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
          echo "Tag ${TAG} already exists, skipping tag creation"
        else
          git tag "${TAG}"
          git push origin "${TAG}"
        fi

    - name: Create GitHub release and upload assets
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.new_version }}
        name: Release ${{ steps.version.outputs.new_version }}
        body: |
          ## Changes in ${{ steps.version.outputs.new_version }}

          See [CHANGELOG.md](https://github.com/FROSTR-ORG/igloo-server/blob/master/CHANGELOG.md) for full details.

          ### Installation

          **Docker (Recommended)**:
          ```bash
          docker pull ghcr.io/frostr-org/igloo-server:${{ steps.version.outputs.version_number }}
          ```

          **From Source**:
          ```bash
          curl -L https://github.com/FROSTR-ORG/igloo-server/archive/${{ steps.version.outputs.new_version }}.tar.gz | tar -xz
          cd igloo-server-${{ steps.version.outputs.version_number }}
          bun install
          bun run build
          bun run start
          ```
        draft: false
        prerelease: false
        files: |
          ./release/igloo-server-${{ steps.version.outputs.version_number }}-src.tar.gz
          ./release/igloo-server-${{ steps.version.outputs.version_number }}.tar.gz

  docker:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ needs.release.outputs.new_version }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/frostr-org/igloo-server:latest
          ghcr.io/frostr-org/igloo-server:${{ needs.release.outputs.version_number }}
        labels: |
          org.opencontainers.image.title=Igloo Server
          org.opencontainers.image.description=A server-based signing device for the FROSTR protocol
          org.opencontainers.image.source=https://github.com/FROSTR-ORG/igloo-server
          org.opencontainers.image.version=${{ needs.release.outputs.version_number }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Umbrel Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: packages/umbrel/igloo/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/frostr-org/igloo-server:umbrel-latest
          ghcr.io/frostr-org/igloo-server:umbrel-${{ needs.release.outputs.version_number }}
        labels: |
          org.opencontainers.image.title=Igloo Server (Umbrel)
          org.opencontainers.image.description=Igloo Server packaged for Umbrel app deployments
          org.opencontainers.image.source=https://github.com/FROSTR-ORG/igloo-server
          org.opencontainers.image.version=${{ needs.release.outputs.version_number }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
